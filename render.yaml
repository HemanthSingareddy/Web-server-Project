services:
  - type: web
    name: get-fit-buddy-server
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm run build --prefix get-fit-buddy 2>/dev/null || true
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: get_fit_buddy
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: get-fit-buddy-server
          property: renderURL
      - key: PORT
        value: 3000
